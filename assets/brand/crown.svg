<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title">
  <title id="title">Majestat crown</title>
  <!-- The crown: five peaks, symmetric about x = 256, on a band. -->
  <g fill="#E8B44A">
    <path d="M96 336 L112 150 L148 250 L184 130 L220 250 L256 118 L292 250 L328 130 L364 250 L400 150 L416 336 Z"/>
    <rect x="88" y="336" width="336" height="48" rx="10"/>
  </g>
  <!-- The jewelled accents: the centre peak is the tallest and carries the largest stone. -->
  <g fill="#B8871F">
    <circle cx="112" cy="150" r="13"/>
    <circle cx="184" cy="130" r="11"/>
    <circle cx="256" cy="118" r="15"/>
    <circle cx="328" cy="130" r="11"/>
    <circle cx="400" cy="150" r="13"/>
  </g>
  <!-- The band's own light: one bright edge, no gradient. -->
  <rect x="88" y="336" width="336" height="8" rx="4" fill="#F2CB74"/>
</svg>
