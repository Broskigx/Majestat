<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title">
  <title id="title">Majestat application icon</title>
  <!--
    The icon is the emblem of `mark.svg` on the ink field, at 1.05 about the emblem's own
    centre (256, 240), which leaves at least a 96-unit margin on every side: a platform that
    masks the icon to a circle or a squircle cuts ink and never the mark. There is no border,
    because the mask is the border.
  -->
  <rect width="512" height="512" rx="96" fill="#0B0E14"/>
  <g transform="translate(256 256) scale(1.05) translate(-256 -240)">
    <g transform="translate(256 287) scale(0.58) translate(-256 -287)">
      <g fill="#9AA4B2">
        <path d="M256 84 L284 292 L284 340 L228 340 L228 292 Z"/>
        <rect x="156" y="339" width="200" height="34" rx="10"/>
        <rect x="240" y="373" width="32" height="79" rx="6"/>
        <circle cx="256" cy="468" r="22"/>
      </g>
      <path d="M252 96 L260 96 L260 336 L252 336 Z" fill="#E4E9F0"/>
      <rect x="156" y="339" width="200" height="7" rx="3.5" fill="#E4E9F0"/>
    </g>
    <g transform="translate(256 170) scale(0.55) translate(-256 -250)">
      <g fill="#E8B44A">
        <path d="M96 336 L112 150 L148 250 L184 130 L220 250 L256 118 L292 250 L328 130 L364 250 L400 150 L416 336 Z"/>
        <rect x="88" y="336" width="336" height="48" rx="10"/>
      </g>
      <g fill="#B8871F">
        <circle cx="112" cy="150" r="13"/>
        <circle cx="184" cy="130" r="11"/>
        <circle cx="256" cy="118" r="15"/>
        <circle cx="328" cy="130" r="11"/>
        <circle cx="400" cy="150" r="13"/>
      </g>
      <rect x="88" y="336" width="336" height="8" rx="4" fill="#F2CB74"/>
    </g>
  </g>
</svg>
