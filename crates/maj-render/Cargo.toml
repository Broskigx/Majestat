[package]
name = "maj-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
maj-time.workspace = true
maj-core.workspace = true
# Layer 2's media vocabulary and its probe, for the `MediaResolver` adapter. Not an optional
# dependency: `docs/MEDIA.md` §2 made it optional because it expected FFmpeg behind it, and
# the backend this build has is pure Rust with nothing to gate. M2b's FFI crate is where an
# optional dependency belongs.
maj-media.workspace = true
maj-color.workspace = true
maj-graph.workspace = true
maj-playback.workspace = true
serde.workspace = true
# Inflates a PNG's image data. Pure Rust: see the workspace manifest and docs/LICENSING.md.
miniz_oxide.workspace = true

[dev-dependencies]
maj-time.workspace = true
maj-core.workspace = true
